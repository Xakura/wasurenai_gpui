[package]
name = "wasurenai_gpui"
version = "0.2.0"
edition = "2024"

[dependencies]
# gpui 门面：gpui-pre 0.3.12 + gpui-base 0.10 + gpui-component 0.10
gpui-kit = "=0.10.0"
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
] }
tray-icon = "0.26"
global-hotkey = "0.10"
