name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Git 标签（留空则使用当前分支 Cargo.toml 版本）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version and tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
              if (-not $m) {
                throw "无法从 Cargo.toml 解析版本号"
              }
              $tag = "v$($m.Matches[0].Groups[1].Value)"
            }
          }
          $version = $tag.TrimStart('v')
          $prerelease = if ($tag -match '-') { 'true' } else { 'false' }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $tag (version: $version, prerelease: $prerelease)"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: pwsh
        run: cargo test --locked

      - name: Run clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $found = $null
          $cmd = Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue
          if ($cmd) { $found = $cmd.Source }
          if (-not $found) {
            foreach ($p in @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            )) {
              if ($p -and (Test-Path $p)) { $found = $p; break }
            }
          }
          if (-not $found) {
            Write-Host "未检测到 ISCC.exe，正在通过 Chocolatey 安装 Inno Setup 6..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "已检测到 ISCC.exe: $found"
          }

      - name: Build installer, portable zip, and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          pwsh -File packaging/windows/build.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portableZip = "dist/Wasurenai-$version-windows-x64-portable.zip"
          Compress-Archive -Path target/release/wasurenai_gpui.exe -DestinationPath $portableZip -Force

          $artifacts = @(
            "dist/Wasurenai-$version-setup.exe",
            $portableZip
          )
          $lines = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Wasurenai ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/Wasurenai-${{ steps.meta.outputs.version }}-setup.exe
            dist/Wasurenai-${{ steps.meta.outputs.version }}-windows-x64-portable.zip
            dist/SHA256SUMS.txt
